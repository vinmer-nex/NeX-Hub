<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1c1c20"/>
      <stop offset="0.45" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.05" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f1efec"/>
      <stop offset="1" stop-color="#c3bfb6"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4e7c6" stop-opacity="0.75"/>
      <stop offset="0.4" stop-color="#c9a96a" stop-opacity="0.22"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#c9a96a" stop-opacity="0.48"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="492" height="492" rx="114" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="114" fill="url(#sheen)"/>
  <rect x="12.5" y="12.5" width="487" height="487" rx="111.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <g filter="url(#soft)">
    <text x="256" y="327" text-anchor="middle"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-weight="600" font-size="204" letter-spacing="4"
          fill="url(#ink)">NX</text>
  </g>
  <rect x="228" y="382" width="56" height="3" rx="1.5" fill="#c9a96a" opacity="0.85"/>
</svg>
